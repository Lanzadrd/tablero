<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tablero</title>
    <style>
      html { background: #f5f5f7; }
      @media (prefers-color-scheme: dark) { html { background: #111113; } }
      html[data-theme='light'] { background: #f5f5f7; }
      html[data-theme='dark'] { background: #111113; }
    </style>
    <script>
      // La apariencia elegida (src/theme.ts), antes de pintar: sin destello del otro color.
      try {
        var tema = JSON.parse(localStorage.getItem('tablero.tema') || 'null')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
